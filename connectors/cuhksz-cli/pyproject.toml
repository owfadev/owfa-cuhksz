[project]
name = "cuhkszcli"
version = "0.4.3"
description = "CUHK-SZ unified read-only CLI connector (bb.cuhk.edu.cn Blackboard + sis.cuhk.edu.cn PeopleSoft SIS)"
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
]

[project.scripts]
# single entry since 0.3.0 — legacy bb-cli / sis-cli console scripts were removed;
# use `cuhksz-cli bb ...` / `cuhksz-cli sis ...`
cuhksz-cli = "cuhkszcli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cuhkszcli", "bbcli", "siscli"]
