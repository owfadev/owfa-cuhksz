schema_version: 1
id: cuhksz
version: 0.2.1
compat: ">= 0.2"
members: [cuhksz, bb, bb-map, bb-quiz, bb-teach, bb-track, sis, registry]
connectors:
  - name: cuhksz-cli
    path: connectors/cuhksz-cli
    note: "unified entry since 0.2.1 — 'cuhksz-cli bb ...' (Blackboard, bbcli backend) and 'cuhksz-cli sis ...' (PeopleSoft SIS, siscli backend); the legacy bb-cli / sis-cli console scripts remain as thin wrappers over the same backends; credential stores unchanged (~/.bb-cli/, ~/.sis-cli/)
depends: [framework]
uninstall:
  retains: [wiki/cuhksz/, cuhksz/]
  credentials: [~/.bb-cli/, ~/.sis-cli/]
  bridges: [profile#domain-cognition, language#consumers]
  processes: []
disclosure: "Read-only scraping of bb.cuhk.edu.cn and sis.cuhk.edu.cn via ADFS SSO; processes grades, coursework and enrollment records (privacy: high); credentials only on this machine (~/.bb-cli, ~/.sis-cli); academic data never enters any git repository."
menu:
  cuhksz: domain root — identity page, term digest, family territory
  bb: course-ops base — term/course identity pages
  bb-map: course mapping — BB artifacts to canonical four-bucket pages
  bb-track: cognition profile — per-point mastery readings + evidence stream
  bb-teach: fine-grained teaching — mode-matrix explanations from the profile
  bb-quiz: self-testing — generated practice, grading flows back to the profile
  sis: student records — transcripts, timetable, enrollment windows
  registry: academic regulations — materialized policies + index
