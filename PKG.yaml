schema_version: 1
id: cuhksz
version: 0.4.1
compat: ">= 0.5.2"
members: [cuhksz, bb, bb-map, bb-quiz, bb-teach, bb-track, sis, sis-course, registry]
connectors:
  - name: cuhksz-cli
    path: connectors/cuhksz-cli
    note: "single entry since connector 0.3.0 — 'cuhksz-cli bb ...' (Blackboard, bbcli backend) and 'cuhksz-cli sis ...' (PeopleSoft SIS, siscli backend); the legacy bb-cli / sis-cli console scripts were removed; state lives in the machine substrate $OWFA_HOME/connectors/cuhksz-cli/homes/<id>/{bb,sis} (component_dir), with BB_CLI_HOME / SIS_CLI_HOME kept only as explicit compatibility overrides; migrate with 'cuhksz-cli home migrate [--dry-run]'"
depends: [framework]
uninstall:
  retains: [wiki/cuhksz/, cuhksz/]
  credentials: [$OWFA_HOME/connectors/cuhksz-cli/]
  bridges: [profile#domain-cognition, language#consumers]
  processes: []
disclosure: "Read-only scraping of bb.cuhk.edu.cn and sis.cuhk.edu.cn via ADFS SSO; processes grades, coursework and enrollment records (privacy: high); credentials live only on this machine in the OWFA substrate ($OWFA_HOME/connectors/cuhksz-cli/homes/<id>/{bb,sis}; the legacy ~/.bb-cli / ~/.sis-cli only if never migrated); academic data never enters any git repository."
menu:
  cuhksz: domain root — identity page, term digest, family territory
  bb: course-ops base — term/course identity pages
  bb-map: course mapping — BB artifacts to canonical four-bucket pages
  bb-track: cognition profile — per-point mastery readings + evidence stream
  bb-teach: fine-grained teaching — mode-matrix explanations from the profile
  bb-quiz: self-testing — generated practice, grading flows back to the profile
  sis: student records — transcripts, timetable, enrollment windows
  sis-course: course-catalog advisory — Class Search courses/sections/times (query-only, read-only)
  registry: academic regulations — materialized policies + index
