id: sis-course
version: 0.1
depends:
  - sis
  - cuhksz
  - domain
  - wiki
  - trust
  - log
commands:
  - sis-course
updated: 2026-11-23
attachment: []  # advisory command only: no materialization zone, no territory of its own
fields:
  course_catalog: "block mapping (optional, only on an explicitly requested saved comparison page) — term (resolved label) / strm / subject / catalog / fetched_at / stale_after; the values are a regenerable SIS snapshot, never an enrollment record"
inject: "Course-catalog advisory consumption side of the sis subdomain (source sis.cuhk.edu.cn Class Search via `cuhksz-cli sis search`, **read-only**): resolves the term (strm code, or a label substring that must match exactly one term — an ambiguous one is refused with candidates; omitted = the newest term that is not in the future), queries by at least two criteria (subject and/or catalog), and presents courses with sections, meeting times, rooms and instructors as **建议参考** — it never picks courses for the user, never promises an optimal plan, and never adds to a cart or performs any state-changing transaction; results stay in the conversation by default (no projection), a comparison page is written only when the user explicitly asks, and the final authority is SIS and the academic regulations. 本命令只提供课程信息的查询与参考建议；AI 不能保证给出最优选课方案，也不代替用户做决定；连接器是**只读**的——不选课、不加购物车、不交作业、不执行任何 state-changing 交易；最终以 SIS 与教务规定为准。"
inject_tier: member
usage:
  - "Resolve the term first: `cuhksz-cli sis search --subject <code>` echoes the resolved term; `--term` accepts a label substring ('Term 2') or the strm code, omitted = the newest term. State the resolved term in the answer"
  - "Query with at least two criteria (term + subject and/or catalog): `cuhksz-cli sis search --subject AIE --catalog 1904`. A subject alone may exceed the server's 50-class ceiling (structured notice) and only the first 3 sections per course are rendered — narrow with --catalog/--contains and never present a short list as exhaustive"
  - "Present as 建议参考: courses → sections (L01-LEC / S01-SUP …) → meeting times / room / instructor. Compare against the user's stated constraints (term, time conflicts, interests) but leave the choice with the user — never call a schedule optimal, never auto-add to a cart, never promise an enrollment outcome"
  - "Only on an explicit request to keep the comparison, save a notes page (term/filters + fetched_at + stale_after + backlink); otherwise write no page — the data is fully regenerable from SIS"
checks:
  - "Semantic items (v0.1 manual, attached audit deferred): a course-catalog answer presenting a choice as final/optimal or acting on the user's behalf → error; an answer omitting the resolved term, or the first-3-sections/50-class limits where they matter → warning; a stored catalog page without term/filters/stale_after → warning; any cart/enrollment/state-changing action attempted → error; a saved comparison page outside wiki/cuhksz/sis/ → warning"
